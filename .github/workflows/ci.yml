name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Validate repository structure
        run: python scripts/validate_repo.py
      - name: Validate Unified Intake scenarios
        run: python scripts/validate_routing_scenarios.py
      - name: Verify first-party research boundary
        run: |
          python skills/cn-case-hub/scripts/check_first_party_boundary.py
          python skills/cn-law-hub/scripts/check_first_party_boundary.py
      - name: Installer dry-run
        run: ./install.sh --dry-run --target "$RUNNER_TEMP/legal-os-skills"
      - name: Run synthetic tests
        run: python -m unittest discover -s tests -v
      - name: Run bundled Skill tests
        run: |
          python -m unittest discover -s skills/legal-os-contract/tests -v
          python -m unittest discover -s skills/legal-quality-gate/tests -v
          python -m unittest discover -s skills/legal-os-unified-intake/tests -v
